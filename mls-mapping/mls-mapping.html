<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MLS — Mapping psychédélique réactif au son</title>
<style>
  :root {
    --speed: 1;          /* multiplicateur de vitesse global */
    --logo-size: 46vmin; /* taille du logo */
    --beat: 0;           /* 0..1 piloté par l'audio (JS) */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: "Arial Black", system-ui, sans-serif;
  }

  /* Halo de couleur derrière le logo */
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(80, 0, 160, calc(0.30 + var(--beat) * 0.4)) 0%,
        rgba(0, 0, 0, 1) 70%);
    animation: bgpulse calc(6s / var(--speed)) ease-in-out infinite;
  }

  @keyframes bgpulse {
    0%, 100% { filter: hue-rotate(0deg);   }
    50%      { filter: hue-rotate(360deg); }
  }

  /* Canvas des points psychédéliques (derrière le logo) */
  #particles { position: fixed; inset: 0; z-index: 1; }

  /* Le logo */
  #logo-wrap {
    position: relative;
    z-index: 2;
    width: var(--logo-size);
    height: var(--logo-size);
    display: grid;
    place-items: center;
    animation:
      blink calc(2.4s / var(--speed)) steps(1, end) infinite,
      breathe calc(4s / var(--speed)) ease-in-out infinite;
    /* le beat audio agrandit le logo */
    transform: scale(calc(1 + var(--beat) * 0.18));
    transition: transform .06s linear;
  }

  #logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: colorcycle calc(8s / var(--speed)) linear infinite;
    filter: drop-shadow(0 0 30px rgba(140, 0, 255, 0.8));
    will-change: filter, transform;
  }

  @keyframes colorcycle {
    0%   { filter: hue-rotate(0deg)   saturate(1.4) drop-shadow(0 0 30px hsl(280 100% 60% / .85)); }
    25%  { filter: hue-rotate(90deg)  saturate(1.8) drop-shadow(0 0 45px hsl(190 100% 55% / .85)); }
    50%  { filter: hue-rotate(180deg) saturate(1.6) drop-shadow(0 0 35px hsl(120 100% 55% / .85)); }
    75%  { filter: hue-rotate(270deg) saturate(1.9) drop-shadow(0 0 50px hsl(330 100% 60% / .85)); }
    100% { filter: hue-rotate(360deg) saturate(1.4) drop-shadow(0 0 30px hsl(280 100% 60% / .85)); }
  }

  @keyframes blink {
    0%, 6%   { opacity: 1;   }
    7%       { opacity: 0.15;}
    8%       { opacity: 1;   }
    11%      { opacity: 0.2; }
    12%      { opacity: 1;   }
    100%     { opacity: 1;   }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.06); }
  }

  /* Anneau lumineux qui pulse autour du logo */
  #logo-wrap::after {
    content: "";
    position: absolute;
    inset: -8%;
    border-radius: 50%;
    border: 3px solid hsl(280 100% 60%);
    animation: ring calc(3s / var(--speed)) ease-out infinite;
    pointer-events: none;
  }

  @keyframes ring {
    0%   { transform: scale(0.9);  opacity: 0.9; filter: hue-rotate(0deg);   }
    100% { transform: scale(1.6);  opacity: 0;   filter: hue-rotate(180deg); }
  }

  /* Texte défilant en bas */
  #marquee {
    position: fixed;
    z-index: 3;
    bottom: 5vh;
    left: 0; right: 0;
    overflow: hidden;
    white-space: nowrap;
    pointer-events: none;
  }
  #marquee .track {
    display: inline-block;
    padding-left: 100%;
    font-size: clamp(20px, 4vmin, 56px);
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 18px hsl(280 100% 60%), 0 0 40px hsl(280 100% 50%);
    animation:
      scroll calc(18s / var(--speed)) linear infinite,
      colorcycle calc(8s / var(--speed)) linear infinite;
  }
  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* Message si l'image est absente */
  #fallback {
    position: fixed; z-index: 3;
    top: 50%; left: 0; right: 0;
    transform: translateY(120px);
    text-align: center;
    color: #bbb; font-size: 14px; letter-spacing: .5px;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }

  /* Bandeau d'aide / état */
  #help {
    position: fixed; z-index: 5;
    top: 12px; left: 12px;
    color: rgba(255,255,255,.55);
    font: 12px/1.6 system-ui, sans-serif;
    opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 60ch;
  }
  body:hover #help { opacity: 1; }
  #help b { color:#fff; }
  #status { color: hsl(150 100% 60%); }
  #status.off { color: hsl(0 100% 65%); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="particles"></canvas>
    <div id="logo-wrap">
      <img id="logo" src="mls-logo.png" alt="MLS — Monte Le Son" />
    </div>
  </div>

  <div id="marquee"><span class="track" id="track">SONORISATION&nbsp;&nbsp;•&nbsp;&nbsp;ÉCLAIRAGE&nbsp;&nbsp;•&nbsp;&nbsp;ÉVÈNEMENTIEL&nbsp;&nbsp;•&nbsp;&nbsp;MONTE LE SON&nbsp;&nbsp;•&nbsp;&nbsp;</span></div>

  <div id="fallback">⚠️ Place ton logo nommé « mls-logo.png » dans le même dossier que ce fichier.</div>

  <div id="help">
    <b>F</b> plein écran &nbsp;•&nbsp; <b>M</b> micro : <span id="status" class="off">off</span> &nbsp;•&nbsp;
    <b>C</b> palette &nbsp;•&nbsp; <b>+/-</b> vitesse &nbsp;•&nbsp; <b>↑/↓</b> nb points &nbsp;•&nbsp;
    <b>T</b> texte on/off &nbsp;•&nbsp; <b>Espace</b> pause
  </div>

<script>
(() => {
  const root = document.documentElement;

  // ---- Image manquante ----
  const logo = document.getElementById('logo');
  const fb   = document.getElementById('fallback');
  logo.addEventListener('error', () => { logo.style.visibility='hidden'; fb.style.opacity='1'; });

  // ---- Palettes (plages de teintes HSL) ----
  const PALETTES = [
    { name:'Psyché',  hues:[280,190,120,330] },   // multicolore arc-en-ciel
    { name:'Néon MLS',hues:[265,220,300,200] },   // violets / bleus
    { name:'Feu',     hues:[0,20,40,330]     },   // rouge / orange
    { name:'Océan',   hues:[180,200,160,220] },   // cyan / turquoise
    { name:'Acide',   hues:[90,140,60,160]   },   // verts fluo
  ];
  let paletteIdx = 0;
  const pick = () => { const p = PALETTES[paletteIdx].hues; return p[(Math.random()*p.length)|0]; };

  // ---- Canvas ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W,H,cx,cy, speed=1, running=true;
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; cx=W/2; cy=H/2; }
  addEventListener('resize', resize); resize();

  const baseR = () => Math.min(W,H)*0.30;
  let N = 140;
  let pts = [];
  function makePoint(){
    return {
      angle: Math.random()*Math.PI*2,
      radius: baseR() + (Math.random()-0.5)*Math.min(W,H)*0.55,
      spin: (Math.random()*0.6+0.2)*(Math.random()<0.5?-1:1),
      size: Math.random()*4+1.5,
      hue: pick() + (Math.random()*30-15),
      hueSpeed: Math.random()*2+0.5,
      twinkle: Math.random()*Math.PI*2,
      twinkleSpeed: Math.random()*0.08+0.02,
    };
  }
  function rebuild(){ pts = Array.from({length:N}, makePoint); }
  rebuild();

  // ---- Audio (micro) ----
  let analyser=null, audioData=null, beat=0;
  const statusEl = document.getElementById('status');
  async function toggleMic(){
    if (analyser){ // couper
      analyser.context.close(); analyser=null;
      statusEl.textContent='off'; statusEl.classList.add('off');
      beat=0; root.style.setProperty('--beat',0);
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const actx = new (window.AudioContext||window.webkitAudioContext)();
      const src = actx.createMediaStreamSource(stream);
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      src.connect(analyser);
      audioData = new Uint8Array(analyser.frequencyBinCount);
      statusEl.textContent='ON'; statusEl.classList.remove('off');
    }catch(e){
      statusEl.textContent='refusé'; statusEl.classList.add('off');
    }
  }

  function readAudio(){
    if(!analyser) return;
    analyser.getByteFrequencyData(audioData);
    // énergie des basses (kick) = premières bandes
    let sum=0; const bands=Math.min(16, audioData.length);
    for(let i=0;i<bands;i++) sum+=audioData[i];
    const level = (sum/bands)/255; // 0..1
    // suivi de crête doux
    beat = Math.max(level, beat*0.90);
    root.style.setProperty('--beat', beat.toFixed(3));
  }

  // ---- Boucle ----
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    readAudio();

    if(running){
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      const R = baseR();
      const boost = 1 + beat*1.8; // les points réagissent au son
      for(const p of pts){
        p.angle += p.spin*dt*speed*(1+beat*1.5);
        p.hue   += p.hueSpeed*speed;
        p.twinkle += p.twinkleSpeed*speed;
        const rr = (p.radius + Math.sin(p.twinkle)*30) * (1 + beat*0.25);
        const x = cx + Math.cos(p.angle)*rr*(R/baseR());
        const y = cy + Math.sin(p.angle)*rr*(R/baseR());
        const alpha = (0.5 + 0.5*Math.sin(p.twinkle)) * Math.min(1, 0.6+beat);
        const s = p.size*(0.6 + 0.6*Math.sin(p.twinkle))*boost;
        const g = ctx.createRadialGradient(x,y,0,x,y,s*4);
        g.addColorStop(0,`hsla(${((p.hue%360)+360)%360},100%,65%,${alpha})`);
        g.addColorStop(1,`hsla(${((p.hue%360)+360)%360},100%,50%,0)`);
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(x,y,s*4,0,Math.PI*2); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Commandes ----
  function setSpeed(v){ speed=Math.max(0.1,Math.min(5,v)); root.style.setProperty('--speed',speed); }
  function repaintHues(){ for(const p of pts) p.hue = pick()+(Math.random()*30-15); }

  const marquee = document.getElementById('marquee');
  document.addEventListener('keydown',(e)=>{
    switch(e.key){
      case 'f': case 'F':
        document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen(); break;
      case 'm': case 'M': toggleMic(); break;
      case 'c': case 'C':
        paletteIdx=(paletteIdx+1)%PALETTES.length; repaintHues(); break;
      case '+': case '=': setSpeed(speed+0.2); break;
      case '-': case '_': setSpeed(speed-0.2); break;
      case 'ArrowUp':   N=Math.min(400,N+20); rebuild(); e.preventDefault(); break;
      case 'ArrowDown': N=Math.max(20, N-20); rebuild(); e.preventDefault(); break;
      case 't': case 'T':
        marquee.style.display = (marquee.style.display==='none'?'block':'none'); break;
      case ' ':
        running=!running;
        document.querySelectorAll('#logo-wrap, #logo-wrap img, #stage, #track')
          .forEach(el=>el.style.animationPlayState = running?'running':'paused');
        e.preventDefault(); break;
    }
  });
})();
</script>
</body>
</html>
