<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MLS — Mapping psychédélique</title>
<style>
  :root {
    --speed: 1;          /* multiplicateur de vitesse global */
    --logo-size: 46vmin; /* taille du logo */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: system-ui, sans-serif;
  }

  /* Halo de couleur derrière le logo */
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(80, 0, 160, 0.35) 0%,
        rgba(0, 0, 0, 1) 70%);
    animation: bgpulse calc(6s / var(--speed)) ease-in-out infinite;
  }

  @keyframes bgpulse {
    0%, 100% { filter: hue-rotate(0deg);   }
    50%      { filter: hue-rotate(360deg); }
  }

  /* Canvas des points psychédéliques (derrière le logo) */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* Le logo */
  #logo-wrap {
    position: relative;
    z-index: 2;
    width: var(--logo-size);
    height: var(--logo-size);
    display: grid;
    place-items: center;
    /* clignotement (blink) */
    animation:
      blink calc(2.4s / var(--speed)) steps(1, end) infinite,
      breathe calc(4s / var(--speed)) ease-in-out infinite;
  }

  #logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* changement de couleur + glow */
    animation: colorcycle calc(8s / var(--speed)) linear infinite;
    filter: drop-shadow(0 0 30px rgba(140, 0, 255, 0.8));
    will-change: filter, transform;
  }

  @keyframes colorcycle {
    0%   { filter: hue-rotate(0deg)   saturate(1.4) drop-shadow(0 0 30px hsl(280 100% 60% / .85)); }
    25%  { filter: hue-rotate(90deg)  saturate(1.8) drop-shadow(0 0 45px hsl(190 100% 55% / .85)); }
    50%  { filter: hue-rotate(180deg) saturate(1.6) drop-shadow(0 0 35px hsl(120 100% 55% / .85)); }
    75%  { filter: hue-rotate(270deg) saturate(1.9) drop-shadow(0 0 50px hsl(330 100% 60% / .85)); }
    100% { filter: hue-rotate(360deg) saturate(1.4) drop-shadow(0 0 30px hsl(280 100% 60% / .85)); }
  }

  /* clignotement : flashes rapides puis stable */
  @keyframes blink {
    0%, 6%   { opacity: 1;   }
    7%       { opacity: 0.15;}
    8%       { opacity: 1;   }
    11%      { opacity: 0.2; }
    12%      { opacity: 1;   }
    100%     { opacity: 1;   }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.06); }
  }

  /* Anneau lumineux qui pulse autour du logo */
  #logo-wrap::after {
    content: "";
    position: absolute;
    inset: -8%;
    border-radius: 50%;
    border: 3px solid hsl(280 100% 60%);
    animation: ring calc(3s / var(--speed)) ease-out infinite;
    pointer-events: none;
  }

  @keyframes ring {
    0%   { transform: scale(0.9);  opacity: 0.9; filter: hue-rotate(0deg);   }
    100% { transform: scale(1.6);  opacity: 0;   filter: hue-rotate(180deg); }
  }

  /* Message si l'image est absente */
  #fallback {
    position: fixed;
    z-index: 3;
    bottom: 4vh;
    left: 0; right: 0;
    text-align: center;
    color: #bbb;
    font-size: 14px;
    letter-spacing: .5px;
    opacity: .0;
    transition: opacity .4s;
    pointer-events: none;
  }
  #logo-wrap img.broken ~ #fallback { opacity: 1; }

  /* Aide commandes clavier */
  #help {
    position: fixed;
    z-index: 5;
    top: 12px; left: 12px;
    color: rgba(255,255,255,.45);
    font-size: 12px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  body:hover #help { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="particles"></canvas>
    <div id="logo-wrap">
      <img id="logo" src="mls-logo.png" alt="MLS — Monte Le Son" />
    </div>
  </div>

  <div id="fallback">⚠️ Place ton logo nommé « mls-logo.png » dans le même dossier que ce fichier.</div>

  <div id="help">
    F : plein écran &nbsp;•&nbsp; +/- : vitesse &nbsp;•&nbsp; Espace : pause
  </div>

<script>
(() => {
  // ---- Gestion image manquante ----
  const logo = document.getElementById('logo');
  const fb   = document.getElementById('fallback');
  logo.addEventListener('error', () => {
    logo.style.visibility = 'hidden';
    fb.style.opacity = '1';
  });

  // ---- Points psychédéliques (canvas) ----
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;
  let speed = 1;
  let running = true;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  const N = 140; // nombre de points
  const pts = [];
  const baseR = () => Math.min(W, H) * 0.30; // rayon autour du logo

  for (let i = 0; i < N; i++) {
    pts.push({
      angle: Math.random() * Math.PI * 2,
      // rayon réparti en couronnes autour du logo
      radius: baseR() + (Math.random() - 0.5) * Math.min(W, H) * 0.55,
      spin: (Math.random() * 0.6 + 0.2) * (Math.random() < 0.5 ? -1 : 1),
      size: Math.random() * 4 + 1.5,
      hue: Math.random() * 360,
      hueSpeed: Math.random() * 2 + 0.5,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.08 + 0.02,
    });
  }

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (running) {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter'; // additif = effet néon

      const R = baseR();
      for (const p of pts) {
        p.angle  += p.spin * dt * speed;
        p.hue    += p.hueSpeed * speed;
        p.twinkle += p.twinkleSpeed * speed;

        // respiration du rayon pour un effet "psyché"
        const rr = p.radius + Math.sin(p.twinkle) * 30;
        const x = cx + Math.cos(p.angle) * rr * (R / baseR());
        const y = cy + Math.sin(p.angle) * rr * (R / baseR());

        const alpha = 0.5 + 0.5 * Math.sin(p.twinkle);
        const s = p.size * (0.6 + 0.6 * Math.sin(p.twinkle));

        const grad = ctx.createRadialGradient(x, y, 0, x, y, s * 4);
        grad.addColorStop(0, `hsla(${p.hue % 360}, 100%, 65%, ${alpha})`);
        grad.addColorStop(1, `hsla(${p.hue % 360}, 100%, 50%, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, s * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Commandes clavier ----
  function setSpeed(v) {
    speed = Math.max(0.1, Math.min(5, v));
    document.documentElement.style.setProperty('--speed', speed);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        break;
      case '+': case '=': setSpeed(speed + 0.2); break;
      case '-': case '_': setSpeed(speed - 0.2); break;
      case ' ':
        running = !running;
        document.querySelectorAll('#logo-wrap, #logo-wrap img, #stage')
          .forEach(el => el.style.animationPlayState = running ? 'running' : 'paused');
        e.preventDefault();
        break;
    }
  });
})();
</script>
</body>
</html>
